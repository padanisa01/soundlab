plugins {
    id "com.android.application"
    id "com.chaquo.python"
    // Generates google_app_id etc. from app/google-services.json.
    // NOTE: with this plugin applied, the build FAILS when
    // app/google-services.json is missing -- download the real file
    // from the Firebase Console (audiomech project); it is
    // git-ignored and must exist only on the build machine.
    id "com.google.gms.google-services"
}

android {
    namespace "com.audiofx.app"
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    // local.properties carries build-machine secrets (Groq key for debug,
    // AdMob IDs for release). Hoisted here so every build type can use it.
    def localProps = new Properties()
    def lpFile = rootProject.file("local.properties")
    if (lpFile.exists()) {
        lpFile.withInputStream { localProps.load(it) }
    }

    signingConfigs {
        // Debug-key signing for the release build type, strictly for
        // on-device testing. Off by default; opt in with
        // sign.release.with.debug=true in the git-ignored local.properties.
        // Never use for Play uploads: those need the real upload key.
        debugKeyAsRelease {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // Real upload key for Play bundles, defined only when the
        // keystore properties are present in local.properties. The
        // keystore path must be absolute and the passwords live only
        // on the build machine, never in git:
        //   upload.keystore=/abs/path/audio-mechanic-upload.keystore
        //   upload.store.password=...
        //   upload.key.alias=upload
        //   upload.key.password=...
        if (!localProps.getProperty("upload.keystore", "").trim().isEmpty()) {
            upload {
                storeFile file(localProps.getProperty("upload.keystore").trim())
                storePassword localProps.getProperty("upload.store.password", "")
                keyAlias localProps.getProperty("upload.key.alias", "upload")
                keyPassword localProps.getProperty("upload.key.password", "")
            }
        }
    }

    defaultConfig {
        // URL of the summary proxy (Cloud Run service, ticket AM-1). The
        // user adds summary.proxy.url=<url> to the git-ignored
        // local.properties on their build machine; empty means the app
        // calls Groq directly (debug builds with a local API key only).
        buildConfigField "String", "SUMMARY_PROXY_URL",
                "\"${localProps.getProperty('summary.proxy.url', '')}\""
        applicationId "com.audiofx.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        ndk {
            // Chaquopy ships a native Python interpreter: declare the ABIs.
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        debug {
            // Google test AdMob IDs: safe for development and sideloaded
            // test builds. Release builds (below) inject the real IDs.
            manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
            resValue "string", "banner_ad_unit_id",
                    "ca-app-pub-3940256099942544/6300978111"
            // Groq API key ships in debug builds only. Release builds must
            // go through the summary proxy, so the key never leaves the
            // developer's machine.
            buildConfigField "String", "GROQ_API_KEY",
                    "\"${localProps.getProperty('GROQ_API_KEY', '')}\""
            // Play Console license key for on-device purchase signature
            // verification (ticket AM-2). Empty until the Play Console app
            // is created; verification is skipped with a warning then.
            buildConfigField "String", "PLAY_LICENSE_KEY",
                    "\"${localProps.getProperty('play.license.key', '')}\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Real AdMob IDs are mandatory for release: the user adds
            // admob.app.id and admob.banner.id to the git-ignored
            // local.properties on their build machine.
            def admobAppId = localProps.getProperty("admob.app.id", "").trim()
            def admobBannerId = localProps.getProperty("admob.banner.id", "").trim()
            if (admobAppId.isEmpty() || admobBannerId.isEmpty()) {
                throw new GradleException("Release build requires admob.app.id and admob.banner.id in local.properties. Add your real AdMob IDs from https://apps.admob.com.");
            }
            manifestPlaceholders = [admobAppId: admobAppId]
            resValue "string", "banner_ad_unit_id", admobBannerId
            // No Groq key in release: the diagnosis summary goes through
            // the proxy (SUMMARY_PROXY_URL) with an App Check token.
            buildConfigField "String", "GROQ_API_KEY", "\"\""
            // Play Console license key for on-device purchase signature
            // verification (ticket AM-2). Empty until the Play Console app
            // is created; verification is skipped with a warning then.
            buildConfigField "String", "PLAY_LICENSE_KEY",
                    "\"${localProps.getProperty('play.license.key', '')}\""
            // Signing precedence for release: the real upload key wins
            // whenever upload.keystore is set in local.properties (Play
            // bundles and APKs come out Play-signed, and
            // sign.release.with.debug is ignored). Without it, fall back
            // to the debug key for on-device testing when
            // sign.release.with.debug=true, so the IDE can install the
            // release variant directly from the run button.
            if (!localProps.getProperty("upload.keystore", "").trim().isEmpty()) {
                signingConfig signingConfigs.upload
            } else if (localProps.getProperty("sign.release.with.debug", "false").toBoolean()) {
                signingConfig signingConfigs.debugKeyAsRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        // Python version bundled in the APK. Chaquopy 17.1 supports up to 3.14.
        version "3.12"
        pip {
            // NumPy gives the reverb an FFT convolution fast path on device.
            // The module also runs without it via a pure-Python fallback.
            install "numpy"
            // lameenc provides the MP3 encoder used by the Save-as-MP3
            // feature (audiofx.pipeline.encode_mp3).
            install "lameenc"
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.android.billingclient:billing:7.1.1'
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
    // Play Integrity App Check for the summary proxy (ticket AM-1).
    implementation 'com.google.firebase:firebase-appcheck-playintegrity:18.0.0'
    // App Check debug provider, debug builds only: lets a sideloaded
    // debug build pass proxy attestation with a console-registered
    // debug token. Never packaged into release builds.
    debugImplementation 'com.google.firebase:firebase-appcheck-debug:18.0.0'
    // Remote Config for ads + paid-feature gating.
    implementation 'com.google.firebase:firebase-config:21.6.0'
    // Analytics for product usage.
    implementation 'com.google.firebase:firebase-analytics:22.0.0'
}
