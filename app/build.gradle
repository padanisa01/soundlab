plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.audiofx.app"
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        // Groq API key for the diagnosis summary (qwen via Groq). The user
        // adds GROQ_API_KEY=<key> to the git-ignored local.properties on
        // their build machine; empty means the summary is skipped.
        def localProps = new Properties()
        def lpFile = rootProject.file("local.properties")
        if (lpFile.exists()) {
            lpFile.withInputStream { localProps.load(it) }
        }
        buildConfigField "String", "GROQ_API_KEY",
                "\"${localProps.getProperty('GROQ_API_KEY', '')}\""
        applicationId "com.audiofx.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            // Chaquopy ships a native Python interpreter: declare the ABIs.
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        // Python version bundled in the APK. Chaquopy 17.1 supports up to 3.14.
        version "3.12"
        pip {
            // NumPy gives the reverb an FFT convolution fast path on device.
            // The module also runs without it via a pure-Python fallback.
            install "numpy"
            // lameenc provides the MP3 encoder used by the Save-as-MP3
            // feature (audiofx.pipeline.encode_mp3).
            install "lameenc"
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.android.billingclient:billing:7.1.1'
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
}
